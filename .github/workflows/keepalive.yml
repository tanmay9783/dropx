name: Keep-alive Render Backend

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute inactivity sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API
        run: |
          curl -f https://dropx-6pky.onrender.com/api/health || echo "Failed but that's okay, it might be waking up"
