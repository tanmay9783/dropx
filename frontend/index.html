<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary SEO Meta Tags -->
    <title>DropX — Instant QR File Sharing & AirDrop Alternative</title>
    <meta name="title" content="DropX — Instant QR File Sharing & AirDrop Alternative" />
    <meta name="description" content="DropX is an instant, zero-knowledge cross-device file sharing platform. Share files, photos, clipboard text, and screen share between phone and laptop using QR codes. No signup, 100% private." />
    <meta name="keywords" content="DropX, file sharing, airdrop alternative, airdrop for windows, airdrop for android, cross platform file transfer, share files qr code, instant file transfer, send files without login, ephemeral file share, encrypted file transfer, p2p screen share, share files phone to pc" />
    <meta name="author" content="DropX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dropxio.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dropxio.vercel.app/" />
    <meta property="og:title" content="DropX — Instant QR File Sharing & AirDrop Alternative" />
    <meta property="og:description" content="Instant cross-device file sharing and live clipboard sync. Pair any phone, laptop, or tablet in seconds via QR code. Zero logins, zero logs, end-to-end encrypted." />
    <meta property="og:image" content="https://dropxio.vercel.app/icon.svg" />
    <meta property="og:site_name" content="DropX" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dropxio.vercel.app/" />
    <meta name="twitter:title" content="DropX — Instant QR File Sharing & AirDrop Alternative" />
    <meta name="twitter:description" content="Instant cross-device file sharing and live clipboard sync. Pair any phone, laptop, or tablet in seconds via QR code. Zero logins, zero logs." />
    <meta name="twitter:image" content="https://dropxio.vercel.app/icon.svg" />

    <!-- Google Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DropX",
        "url": "https://dropxio.vercel.app/",
        "description": "Instant cross-device file sharing, live clipboard sync, and P2P screen mirroring via QR code. Zero logins, ephemeral storage, and end-to-end encryption.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All (iOS, Android, Windows, macOS, Linux)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Instant QR Code Device Pairing",
          "End-to-End Encrypted File Transfer",
          "Live Clipboard & Code Playground",
          "P2P Screen Sharing & Remote View",
          "Snap & Drop Instant Mobile Camera Upload",
          "Global Clipboard Paste Anywhere (Ctrl+V / Cmd+V)",
          "Zero Permanent Server Storage"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-slate-950 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
